services:
  web:
    build: .
    image: slot-audit:latest
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DATA_DIR: /data
    ports:
      # Configurable host port: HOST_PORT=9090 docker compose up web
      - "${HOST_PORT:-8080}:8080"
    volumes:
      - audit-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2); sys.exit(0 if r.status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  verify:
    image: slot-audit:latest
    build: .
    environment:
      BASE_URL: http://web:8080
    command: ["python", "tests/verify.py"]
    depends_on:
      web:
        condition: service_healthy

volumes:
  audit-data:
